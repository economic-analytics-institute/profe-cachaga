<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>PROFE CACHAGA · ECO-105</title>
<style>
html,body{margin:0;background:#08101d;color:#f6f9ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{min-height:70vh;display:grid;place-items:center;padding:32px}.box{max-width:560px;text-align:center}.mark{width:58px;height:58px;margin:auto;border-radius:18px;display:grid;place-items:center;background:#65e4bc;color:#061710;font-weight:900;font-size:20px}.bar{height:8px;margin:24px auto 10px;border-radius:999px;background:#1a2941;overflow:hidden}.bar span{display:block;height:100%;width:20%;background:#65e4bc;animation:load 1.2s ease-in-out infinite alternate}@keyframes load{to{width:95%}}small{color:#aab7cc}.err{color:#ff9cab}
</style>
</head>
<body><main><div class="box"><div class="mark">PC</div><h1>PROFE CACHAGA</h1><p>Cargando la plataforma de Economía General…</p><div class="bar"><span></span></div><small id="status">Preparando ejercicios y laboratorios.</small></div></main>
<script>
function patchHtml(html){
  html=html.replace('.shell{width:min(1180px,calc(100% - 34px));margin:auto}','.shell{width:min(1320px,calc(100% - 48px));margin-inline:auto}body{overflow-x:hidden}');
  html=html.replace('.hero{padding:54px 0 34px;display:grid;grid-template-columns:1.08fr .92fr;gap:28px;align-items:center}','.hero{padding:54px 0 34px;display:grid;grid-template-columns:1.08fr .92fr;gap:28px;align-items:center;justify-content:center}');
  html=html.replace('.metric-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:12px 0 34px}.metric{padding:16px;display:flex;gap:10px;align-items:center}.metric span{font-size:1.45rem}.metric strong{display:block;font-size:1.13rem}.metric small{color:var(--muted)}','.metric-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:12px auto 34px;align-items:stretch}.metric{padding:18px 14px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;text-align:center;min-height:108px}.metric span{font-size:1.55rem;line-height:1}.metric strong{display:block;font-size:1.22rem}.metric small{color:var(--muted)}');
  html=html.replace('const ROSTER_COUNT = 131;','const ROSTER_COUNT = 131;\nconst GUEST_RU = "12345";');
  html=html.replace("async function authorizedRU(ru){\n  const clean=String(ru||'').replace(/\\D/g,'');\n  if(!clean||!CLOUD_ENDPOINT)return false;","async function authorizedRU(ru){\n  const clean=String(ru||'').replace(/\\D/g,'');\n  if(clean===GUEST_RU)return true;\n  if(!clean||!CLOUD_ENDPOINT)return false;");
  html=html.replace("function registerCloud(){if(!state.profile)return;syncPayload({action:'register',course:COURSE_CODE,ts:new Date().toISOString(),student:state.profile})}","function registerCloud(){if(!state.profile||state.profile.guest)return;syncPayload({action:'register',course:COURSE_CODE,ts:new Date().toISOString(),student:state.profile})}");
  html=html.replace("function syncHistory(){if(!state.profile)return;registerCloud();state.history.filter(x=>!x.synced).slice(-100).forEach(x=>{syncPayload({action:'attempt',course:COURSE_CODE,student:state.profile,attempt:x});x.synced=true});saveState();if(CLOUD_ENDPOINT)toast('Sincronización enviada');else toast('Seguimiento en línea aún no configurado')}","function syncHistory(){if(!state.profile)return;if(state.profile.guest){toast('Modo invitado: el progreso queda solo en este navegador');return}registerCloud();state.history.filter(x=>!x.synced&&!x.guest).slice(-100).forEach(x=>{syncPayload({action:'attempt',course:COURSE_CODE,student:state.profile,attempt:x});x.synced=true});saveState();if(CLOUD_ENDPOINT)toast('Sincronización enviada');else toast('Seguimiento en línea aún no configurado')}");
  html=html.replace("function renderProfile(){const p=state.profile;document.getElementById('studentName').textContent=p?p.name:'—';document.getElementById('studentMeta').textContent=p?`RU ${p.ru} · Paralelo ${COURSE_PARALLEL} · Registro validado`:`Completa tu registro para comenzar. Nómina habilitada: ${ROSTER_COUNT} RU.`}","function renderProfile(){const p=state.profile;const badge=document.querySelector('.student-card .badge');document.getElementById('studentName').textContent=p?p.name:'—';document.getElementById('studentMeta').textContent=p?(p.guest?'Acceso invitado · Progreso local · Sin seguimiento docente':`RU ${p.ru} · Paralelo ${COURSE_PARALLEL} · Registro validado`):`Completa tu registro para comenzar. Nómina habilitada: ${ROSTER_COUNT} RU.`;if(badge)badge.textContent=p&&p.guest?'🌐 Invitado':'👤 Estudiante registrado'}");
  html=html.replace('response_ms:Date.now()-session.start,synced:false};','response_ms:Date.now()-session.start,synced:Boolean(state.profile?.guest),guest:Boolean(state.profile?.guest)};');
  html=html.replace("if(CLOUD_ENDPOINT&&state.profile){syncPayload({action:'attempt',course:COURSE_CODE,student:state.profile,attempt});attempt.synced=true;saveState()}","if(CLOUD_ENDPOINT&&state.profile&&!state.profile.guest){syncPayload({action:'attempt',course:COURSE_CODE,student:state.profile,attempt});attempt.synced=true;saveState()}");
  html=html.replace("async function saveProfile(){const btn=document.getElementById('saveProfileBtn');const name=document.getElementById('regName').value.trim(),ru=document.getElementById('regRU').value.replace(/\\D/g,'');if(name.length<5||ru.length<6){toast('Completa nombre y RU');return}btn.disabled=true;btn.textContent='Validando…';const ok=await authorizedRU(ru);btn.disabled=false;btn.textContent='Validar RU y comenzar';if(!ok){toast('RU no habilitado o no fue posible validarlo. Verifica el número e inténtalo nuevamente.');return}state.profile={id:'eco105b_'+ru,name,ru,parallel:COURSE_PARALLEL,registered_at:state.profile?.registered_at||new Date().toISOString(),validated:true};saveState();renderProfile();document.getElementById('profileModal').classList.add('hidden');registerCloud();toast('RU validado. ¡Bienvenido!')}","async function saveProfile(){const btn=document.getElementById('saveProfileBtn');const name=document.getElementById('regName').value.trim(),ru=document.getElementById('regRU').value.replace(/\\D/g,'');const isGuest=ru===GUEST_RU;if(name.length<3||(!isGuest&&ru.length<6)){toast('Completa nombre y RU');return}btn.disabled=true;btn.textContent='Validando…';const ok=await authorizedRU(ru);btn.disabled=false;btn.textContent='Validar RU y comenzar';if(!ok){toast('RU no habilitado o no fue posible validarlo. Verifica el número e inténtalo nuevamente.');return}state.profile={id:isGuest?'guest_'+uid():'eco105b_'+ru,name,ru,parallel:COURSE_PARALLEL,registered_at:state.profile?.registered_at||new Date().toISOString(),validated:true,guest:isGuest};saveState();renderProfile();document.getElementById('profileModal').classList.add('hidden');if(!isGuest)registerCloud();toast(isGuest?'Acceso invitado habilitado. Tu progreso quedará solo en este navegador.':'RU validado. ¡Bienvenido!')}");
  html=html.replace('<div class="field"><label>Registro universitario / RU</label><input id="regRU" inputmode="numeric" autocomplete="off" placeholder="Ej. 1234567"></div>','<div class="field"><label>Registro universitario / RU</label><input id="regRU" inputmode="numeric" autocomplete="off" placeholder="Ej. 1234567"></div><div class="note" style="margin-top:-6px"><strong>¿No eres estudiante del curso?</strong> Ingresa como invitado con el código <strong>12345</strong>. Tu actividad no se incorpora al seguimiento docente.</div>');
  html=html.replace('👥 Paralelo B · 131 RU','👥 131 estudiantes · acceso invitado');
  return html;
}
(async()=>{
  const status=document.getElementById('status');
  try{
    if(typeof DecompressionStream==='undefined') throw new Error('Tu navegador necesita una versión más reciente de Chrome, Edge, Firefox o Safari.');
    const files=Array.from({length:12},(_,i)=>`payload-${String(i+1).padStart(2,'0')}.txt`);
    const parts=[];
    for(let i=0;i<files.length;i++){
      status.textContent=`Cargando módulo ${i+1} de ${files.length}…`;
      const r=await fetch(files[i],{cache:'no-store'});
      if(!r.ok) throw new Error('No se pudo cargar '+files[i]);
      parts.push((await r.text()).trim());
    }
    const b64=parts.join('');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let html=await new Response(stream).text();
    html=patchHtml(html);
    document.open();document.write(html);document.close();
  }catch(e){status.className='err';status.textContent='No se pudo iniciar PROFE CACHAGA: '+e.message;}
})();
</script></body></html>
